services:
  # FastAPI Backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: judge-dredd-backend
    ports:
      - "127.0.0.1:8001:8000"
    environment:
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - PYTHONUNBUFFERED=1
      - APP_VERSION=1.0.0-beta
      - DATABASE_URL=${DATABASE_URL:-sqlite:////app/data/virkning.db}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost,http://127.0.0.1,http://localhost:3000,http://127.0.0.1:3000}
    env_file:
      - path: .env
        required: false
    volumes:
      - tyr-data:/app/data
    restart: unless-stopped
    networks:
      - judge-dredd-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/readyz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # React Frontend with Nginx
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        REACT_APP_AUTH_MODE: ${REACT_APP_AUTH_MODE:-development}
        REACT_APP_ENTRA_TENANT_ID: ${REACT_APP_ENTRA_TENANT_ID:-}
        REACT_APP_ENTRA_CLIENT_ID: ${REACT_APP_ENTRA_CLIENT_ID:-}
        REACT_APP_ENTRA_API_SCOPE: ${REACT_APP_ENTRA_API_SCOPE:-}
        REACT_APP_ENTRA_REDIRECT_URI: ${REACT_APP_ENTRA_REDIRECT_URI:-}
    container_name: judge-dredd-frontend
    ports:
      - "127.0.0.1:80:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - judge-dredd-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  judge-dredd-network:
    driver: bridge

volumes:
  tyr-data:
